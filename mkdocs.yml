site_name: "Netlas Docs"
site_url: https://docs.netlas.io

extra_css:
  - _stylesheets/extra.css

theme:
  name: material # Theme Materials is used https://squidfunk.github.io/mkdocs-material/
  logo: _assets/Netlas-spider-light.png
  favicon: _assets/Netlas-spider-light_ico.png
  icon:
    annotation: material/plus-circle
  custom_dir: overrides

  font: false # disable Google Fonts
  #  text: Roboto
  #  code: JetBrains Mono

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: Switch to light theme

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: netlas/theme-light
        name: Switch to dark theme
      #primary: custom

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: netlas/theme-dark
        name: Switch to system theme
      #primary: custom

  features:
    #- navigation.tabs
    #- toc.integrate
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy
    - content.code.select
    - content.tooltips
    - content.tabs.link

extra:
  generator: false
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/Netlas_io
    - icon: fontawesome/brands/telegram
      link: https://t.me/netlas
    - icon: fontawesome/brands/discord
      link: https://nt.ls/discord
    - icon: fontawesome/brands/medium
      link: https://netlas.medium.com/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/netlas-io/
    - icon: fontawesome/brands/github
      link: https://github.com/netlas-io
  analytics:
    provider: custom
    container_id: "GTM-5Z2XHMRC"

copyright: "Copyright &copy; 2021 - 2024 Netlas, LLC"

plugins:
  - search
  - social
  - open-in-new-tab
  - mkdocstrings

nav:
  - "Home": index.md
  - "Getting started": getting_started.md
  - "Support & FAQ": support.md
  - "Search tools":
      - search/index.md
      - "IP/Domain info": search/host.md
      - "Search basics": search/search_basics.md
      - "Responses": search/responses.md
      - "DNS registry": search/dns.md
      - "IP WHOIS": search/ip_whois.md
      - "Domain WHOIS": search/domain_whois.md
      - "SSL certificates": search/certs.md
  - "eASM tools":
      - easm/index.md
      - "Discovery": easm/discovery.md
      - "Scanner": easm/scanner.md
  - "Automation":
      - automation/index.md
      - "How to get API key": automation/how_to_get_api_key.md
      - "Setting up SDK & CLI": automation/setup.md
      - "Search tools API": automation/search_tools_api.md
      - "Discovery API": automation/discovery_api.md
      - "Scanner API": automation/scanner_api.md
      - "Datastore API": automation/datastore_api.md
      #- 'Handling Errors'
      - "Python SDK specification": automation/python_sdk.md
      - "API specification": https://app.netlas.io/schema/
  - "Changelog":
      - changelog/index.md
  - "External links":
      - "Netlas.io app": https://app.netlas.io
      - "Netlas.io web-site": https://netlas.io

markdown_extensions:
  - attr_list
  - md_in_html
  - abbr
  - admonition
  - tables
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
